<mat-toolbar>
  <!-- Render projected content -->
  <ng-content></ng-content>
  
  <!-- Title on the left -->
  <div class="nav-container">
    <span>AManagement</span>
    
    <!-- Spacer to push the button to the right -->
    <span class="example-spacer"></span>


    <!-- Quick Search -->
    <mat-form-field class="search-field">
      <input matInput placeholder="Search" (input)="search($event)" aria-label="Search tenants, apartments, requests">
    </mat-form-field>


    <!-- Notifications Bell Icon -->
    <button (click)="toggleNotifications()" class="notification-btn" aria-label="Notifications">
      <mat-icon>notifications</mat-icon>
      <span *ngIf="unreadNotifications > 0" class="notification-badge">{{ unreadNotifications }}</span>
    </button>

    
    <!-- Help/Support Icon -->
    <button (click)="openHelp()" class="help-btn" aria-label="Help">
      <mat-icon>help_outline</mat-icon>
    </button>

    <!-- Account Button with dropdown toggle -->
    <button (click)="toggleMenu()" class="account-btn" aria-label="User account menu">
      <mat-icon>account_circle</mat-icon>
    </button>
  </div>

  <!-- Custom Dropdown Menu -->
  <div *ngIf="menuOpen" class="dropdown-menu">
    <button (click)="profile()" class="dropdown-item">Profile</button>
    <button (click)="settings()" class="dropdown-item">Settings</button>
    <button (click)="logout()" class="dropdown-item">Logout</button>
  </div>
</mat-toolbar>
