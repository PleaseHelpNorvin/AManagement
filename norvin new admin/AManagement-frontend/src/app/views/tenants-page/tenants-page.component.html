<div class="page-wrapper">
    <div class="box">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let element"> {{element.id}} </td>
        </ng-container>
      
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
      
        <!-- Apartment Column -->
        <ng-container matColumnDef="apartment">
          <th mat-header-cell *matHeaderCellDef> Apartment/Unit </th>
          <td mat-cell *matCellDef="let element"> {{element.apartment}} | {{element.room}} </td>
        </ng-container>
      
        <!-- Lease Start Column -->
        <ng-container matColumnDef="leaseStart">
          <th mat-header-cell *matHeaderCellDef> Lease Start </th>
          <td mat-cell *matCellDef="let element"> {{element.leaseStart | date: 'yyyy-MM-dd'}} </td>
        </ng-container>
      
        <!-- Lease End Column -->
        <ng-container matColumnDef="leaseEnd">
          <th mat-header-cell *matHeaderCellDef> Lease End </th>
          <td mat-cell *matCellDef="let element"> {{element.leaseEnd | date: 'yyyy-MM-dd'}} </td>
        </ng-container>
      
        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef> Status </th>
          <td mat-cell *matCellDef="let element"> {{element.status}} </td>
        </ng-container>
      
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let element">
            <button mat-mini-fab color="primary" (click)="viewTenant(element)">
              <mat-icon>visibility</mat-icon>
            </button>
            <button mat-mini-fab color="accent" (click)="editTenant(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-mini-fab color="warn" (click)="generatePaymentReminder(element)">
              <mat-icon>warning</mat-icon>
            </button>
            <button mat-mini-fab color="warn" (click)="deleteTenant(element)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>
      
        <!-- Header Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <!-- Data Row -->
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      
    </div>
</div>
