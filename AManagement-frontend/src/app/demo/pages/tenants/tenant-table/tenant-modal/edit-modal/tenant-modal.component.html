<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">
      Edit Tenant: {{ firstName + ' ' + middleName + ' ' + lastName || 'Unknown' }}
    </h5>
  </div>
  <div class="modal-body">
    <form (ngSubmit)="submitEdit()">
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" class="form-control" [(ngModel)]="firstName" name="firstName" required />
      </div>
      
      <div class="form-group">
        <label for="middleName">Middle Name</label>
        <input type="text" id="middleName" class="form-control" [(ngModel)]="middleName" name="middleName" />
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" class="form-control" [(ngModel)]="lastName" name="lastName" required />
      </div>

      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" class="form-control" [(ngModel)]="gender" name="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required />
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" class="form-control" [(ngModel)]="address" name="address" rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" required />
      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModalHandler()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
