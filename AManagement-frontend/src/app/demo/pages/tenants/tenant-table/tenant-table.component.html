<div class="coded-wrapper">
  <div class="container">
    <h2>Tenant List</h2>
  
    <!-- <button class="btn btn-primary mt-2 mb-1" (click)="openModal()">Add New Tenant</button> -->
    <!-- <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
      Open Modal
    </button> -->
    <button type="button" class="btn btn-primary mt-2 mb-1" (click)="showTenantModal()">Add Tenant</button>
  
  
    <table class="table table-bordered table-striped">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let tenant of tenants">
          <td>{{ tenant.firstname }}</td>
          <td>{{ tenant.lastname }}</td>
        </tr>
      </tbody>
    </table>
  
    <!-- Modal for adding a new tenant -->
    <!-- <app-tenant-modal 
      [isVisible]="isVisible" 
      (tenantAdded)="onTenantAdded()"></app-tenant-modal> -->
      <app-tenant-modal 
      [isVisible]="isModalVisible" 
      (tenantAdded)="onTenantAdded()"
      (closeModal)="closeTenantModal()">
      ></app-tenant-modal>
  
  </div>
</div>
